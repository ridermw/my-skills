name: Canvas

on:
  pull_request:
  push:
    branches: [main, canvas-project-room-browser]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native and Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:canvas:native
      - run: npm run test:canvas
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:canvas:browser
      - if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests -v
